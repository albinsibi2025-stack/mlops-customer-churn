
name: Customer Churn CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Pull DVC dataset from S3
        run: |
          dvc pull feature_store/feature_repo/data/customer_features_v3.parquet.dvc

      - name: Initialize Feast
        working-directory: feature_store/feature_repo
        run: |
          feast apply
          feast materialize 2026-11-05T10:10:01+00:00 2026-11-05T10:10:03+00:00

      - name: Run API tests
        run: |
          pytest tests/ -v

      - name: Build Docker image
        run: |
          docker build -t customer-churn-api:ci .

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecr get-login-password --region "${{ secrets.AWS_DEFAULT_REGION }}" |
            docker login --username AWS --password-stdin 387683439404.dkr.ecr.ap-south-1.amazonaws.com

      - name: Push Docker image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag customer-churn-api:ci 387683439404.dkr.ecr.ap-south-1.amazonaws.com/customer-churn-api:${GITHUB_SHA}
          docker tag customer-churn-api:ci 387683439404.dkr.ecr.ap-south-1.amazonaws.com/customer-churn-api:latest

          docker push 387683439404.dkr.ecr.ap-south-1.amazonaws.com/customer-churn-api:${GITHUB_SHA}
          docker push 387683439404.dkr.ecr.ap-south-1.amazonaws.com/customer-churn-api:latest

      - name: Deploy to EC2 through SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_REGION: ap-south-1
          EC2_INSTANCE_ID: i-0955f83aae27b0521
          ECR_REGISTRY: 387683439404.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: customer-churn-api
        run: |
          set -euo pipefail

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          DEPLOY_SCRIPT=$(cat <<EOF
          set -Eeuo pipefail

          IMAGE_URI="${IMAGE_URI}"
          CONTAINER="customer-churn-api"

          OLD_IMAGE=\$(sudo docker inspect --format='{{.Config.Image}}' "\$CONTAINER" 2>/dev/null || true)

          if [ -z "\$OLD_IMAGE" ]; then
            echo "Cannot identify the current container image. Aborting deployment."
            exit 1
          fi

          echo "Authenticating EC2 with Amazon ECR"
          aws ecr get-login-password --region ap-south-1 |
            sudo docker login --username AWS --password-stdin 387683439404.dkr.ecr.ap-south-1.amazonaws.com

          echo "Pulling new image: \$IMAGE_URI"
          sudo docker pull "\$IMAGE_URI"

          rollback() {
            echo "Deployment failed. Restoring previous image."
            sudo docker stop "\$CONTAINER" || true
            sudo docker rm "\$CONTAINER" || true
            sudo docker run -d --name "\$CONTAINER" --restart unless-stopped -p 8000:8000 "\$OLD_IMAGE"
            exit 1
          }

          echo "Stopping previous container"
          sudo docker stop "\$CONTAINER"
          sudo docker rm "\$CONTAINER"

          echo "Starting new container"
          sudo docker run -d --name "\$CONTAINER" --restart unless-stopped -p 8000:8000 "\$IMAGE_URI" || rollback

          echo "Checking application health"
          for attempt in \$(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "EC2 deployment health check passed."
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed."
          rollback
          EOF
          )

          PARAMETERS=$(jq -n --arg command "$DEPLOY_SCRIPT" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --output json
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for EC2 deployment."
          exit 1
