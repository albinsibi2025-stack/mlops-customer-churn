
name: Customer Churn CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Pull DVC dataset from S3
        run: |
          dvc pull feature_store/feature_repo/data/customer_features_v3.parquet.dvc

      - name: Initialize Feast
        working-directory: feature_store/feature_repo
        run: |
          feast apply
          feast materialize 2026-11-05T10:10:01+00:00 2026-11-05T10:10:03+00:00

      - name: Run API tests
        run: |
          pytest tests/ -v

      - name: Build Docker image
        run: |
          docker build -t customer-churn-api:ci .
